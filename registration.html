
<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Registration</h2>

    <form onsubmit="registrationSuccess(event)">

        <label>Name</label>
        <input type="text" placeholder="Enter Name" required><br><br>

        <label>ID</label>
        <input type="text" placeholder="Enter ID" required><br><br>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required><br><br>

        <button type="submit">Register</button><br><br>

    </form>

    <p id="message"></p>

    <a href="address.html">
        <button type="button">Next</button>
    </a>

</div>

<script>
function registrationSuccess(event) {
    event.preventDefault();

    document.getElementById("message").innerHTML =
        "Registration Successful!";

    document.getElementById("message").style.color = "green";
    document.getElementById("message").style.fontWeight = "bold";
}
</script>

</body>
</html>
